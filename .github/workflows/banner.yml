name: banner

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/banner.mjs
      - .github/workflows/banner.yml

permissions:
  contents: write

jobs:
  banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render banner
        env:
          # PROFILE_TOKEN (optional PAT, read:user) counts private contributions
          # like the profile does; the default token only sees public ones.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
        run: node scripts/banner.mjs
      - name: Commit when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/banner.svg
          git diff --cached --quiet && exit 0
          git commit -m "Refresh banner"
          git push
