<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Pavlo Trinko, Senior Product Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#0b1d3a"/>
      <stop offset="0.5" stop-color="#123a6b"/>
      <stop offset="1" stop-color="#1a7f5a"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#ffffff" fill-opacity="0.14"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="m"><rect width="1280" height="300" fill="url(#fade)"/></mask>
  </defs>
  <rect width="1280" height="300" rx="20" fill="url(#bg)"/>
  <rect x="760" width="520" height="300" fill="url(#dots)" mask="url(#m)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="72" y="140" font-size="64" font-weight="700" letter-spacing="-1.5">Pavlo Trinko</text>
    <text x="74" y="194" font-size="28" fill-opacity="0.85">Senior Product Engineer · Web, mobile &amp; desktop · Agent-first</text>
    <text x="74" y="240" font-size="22" fill-opacity="0.55">Lille, France</text>
  </g>
</svg>
